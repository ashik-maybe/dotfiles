# Kitty — Eye Care Night theme. Shell integration on.

include themes/eye-care-night.conf

# Start maximized to match alacritty and foot.
startup_session ~/.config/kitty/sessions/max.conf


# Font: JetBrainsMono Nerd Font Mono, 12pt. Bold and italic follow the font automatically.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0


# Window: do not remember size, start at 1920x1080, 1px padding, decorations on.
remember_window_size    no
initial_window_width    1920
initial_window_height   1080
window_padding_width    1
hide_window_decorations no
confirm_os_window_close 0
sync_to_monitor         yes


# Cursor: beam, blinking, pointer hides after 3 seconds idle.
cursor_shape           beam
cursor_beam_thickness  0.3
cursor_blink_interval  -1
mouse_hide_wait        3.0


# Scrollback: 20000 lines, 3 lines per wheel step.
scrollback_lines        20000
wheel_scroll_multiplier 3.0


# Links: OSC 8 hyperlinks on, URLs detected, underlined on hover.
allow_hyperlinks        yes
detect_urls             yes
underline_hyperlinks    hover


# Shell integration: prompt marking and cwd reporting. Kitty detects the shell.
shell_integration enabled


# Keyboard: clipboard, font scaling, fullscreen. Same as alacritty and foot.
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+kp_add   change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0

map f11                 toggle_fullscreen
