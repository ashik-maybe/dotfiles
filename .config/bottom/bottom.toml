# ==============================================================================
# 🎨 PART 1: THEMING & VISUALS
# ==============================================================================

[styles]
# Base theme (custom colors below will override this)
theme = "default"

# btm does not support import, copy and paste the themes here from bottom/themes
# ==============================================================================
# Catppuccin 🌻 Latte
# ==============================================================================

[styles.cpu]
all_entry_color = "#dc8a78"
avg_entry_color = "#e64553"
cpu_core_colors = ["#d20f39","#fe640b","#df8e1d","#40a02b","#209fb5","#8839ef"]
[styles.memory]
ram_color = "#40a02b"
cache_color = "#d20f39"
swap_color = "#fe640b"
gpu_colors = ["#209fb5","#8839ef","#d20f39","#fe640b","#df8e1d","#40a02b"]
arc_color = "#04a5e5"
[styles.network]
rx_color = "#40a02b"
tx_color = "#d20f39"
rx_total_color = "#04a5e5"
tx_total_color = "#40a02b"
[styles.battery]
high_battery_color = "#40a02b"
medium_battery_color = "#df8e1d"
low_battery_color = "#d20f39"
[styles.tables]
headers = {color = "#dc8a78"}
[styles.graphs]
graph_color = "#6c6f85"
legend_text = {color = "#6c6f85"}
[styles.widgets]
border_color = "#acb0be"
selected_border_color = "#ea76cb"
widget_title = {color = "#dd7878"}
text = {color = "#4c4f69"}
selected_text = {color = "#dce0e8", bg_color = "#8839ef"}
disabled_text = {color = "#eff1f5"}

# ==============================================================================
# 🛠️ PART 2: CORE BEHAVIOR & FLAGS
# ==============================================================================

[flags]
# Refresh interval (2s balances responsiveness with overhead)
rate = "2s"

# Default graph time window
default_time_value = "5m"

# Zoom step size (ms)
time_delta = 15000

# Display time axis
hide_time = false

# Graph data retention period
retention = "10m"

# Temperature display unit
temperature_type = "c"

# Battery status display
battery = true

# Disable mouse interaction (prevents accidental layout changes)
disable_click = true

# Keyboard shortcuts remain active
disable_keys = false

# Process management actions enabled
read_only = false

# Integrated GPU metrics excluded (not required)
disable_gpu = true

# Table navigation indicators
show_table_scroll_position = true
show_table_scroll_bar = true
table_gap = "space"

# Initial widget focus
default_widget_type = "proc"
default_widget_count = 1

# Start in collapsed view
expanded = false

# Full dashboard layout
basic = false

# Network legend style
use_old_network_legend = false


[processes]
# Process table columns (PID omitted for aggregate view)
columns = [
  "Name",
  "CPU%",
  "Mem%",
  "R/s",
  "W/s",
  "State",
  "time"
]

# Default sorting by memory usage
default_sort = "Mem%"
sort_order = "Descending"

# Thread-level details disabled
get_threads = false

# Kernel threads hidden
hide_k_threads = true

# Flat list view (not tree)
default_tree = false
tree_collapse = false

# Display executable names only (improves grouping)
process_command = false

# Advanced process termination available
disable_advanced_kill = false

# Memory values shown as absolute quantities
default_memory_value = true

# Aggregate processes by name (primary view mode)
default_grouped = true

# Search configuration
regex = false
case_sensitive = false
whole_word = false

# Show current CPU usage
current_usage = true

# CPU usage normalized across threads
unnormalized_cpu = false


[cpu]
# Display all CPU threads
default = "all"

# Integer percentage display
show_decimal = false


# ==============================================================================
# 💾 PART 3: DISK & I/O
# ==============================================================================

[disk]
# Disk widget columns (used when widget is manually added)
columns = [
  "Disk",
  "Mount",
  "Used",
  "Free",
  "Total",
  "Used%",
]

default_sort = "Used%"
sort_order = "Descending"
include_unmounted = false


[disk.name_filter]
# Exclude loopback and virtual block devices
is_list_ignored = true
list = [
  '^/dev/loop\d+$',
  '^/dev/zram\d+$',
  '^/dev/ram\d+$',
]
regex = true
case_sensitive = false
whole_word = false


[disk.mount_filter]
# Exclude pseudo-filesystems and container storage
is_list_ignored = true
list = [
  '^/proc$',
  '^/sys$',
  '^/dev$',
  '^/run$',
  '^/var/lib/containers/storage/',
  '^/var/lib/docker/',
]
regex = true
case_sensitive = false
whole_word = false


[disk_io_graph]
# Disk I/O graph settings (for optional widget use)
show_read = true
show_write = true
legend = "disk"
use_log = false
legend_position = "top-right"
include_unmounted = false


[disk_io_graph.name_filter]
# Exclude virtual block devices from I/O graph
is_list_ignored = true
list = [
  '^/dev/loop\d+$',
  '^/dev/zram\d+$',
  '^/dev/ram\d+$',
]
regex = true
case_sensitive = false
whole_word = false


# ==============================================================================
# 🌡️ PART 4: TEMPERATURE & SENSORS
# ==============================================================================

[temperature]
default_sort = "Temperature"
sort_order = "Descending"


[temperature.sensor_filter]
# CPU temperature sensors only (excludes ACPI, WiFi, storage, GPU)
# Note: Adjust patterns if specific sensors are missing/extra on your system
is_list_ignored = false
list = [
  'package id',
  'physical id',
  'x86_pkg_temp',
  'pkg temp',
  'cpu package',
  'cpu temp',
  '^cpu$',
  'cpu',
  'coretemp',
  'k10temp',
  'zenpower',
  'cpu_thermal',
]
regex = true
case_sensitive = false
whole_word = false


[temperature_graph]
legend_position = "top-right"

# Maximum temperature threshold (filters invalid readings)
max_temp = 110.0


[temperature_graph.sensor_filter]
# CPU temperature sensors for graph display
is_list_ignored = false
list = [
  'package id',
  'physical id',
  'x86_pkg_temp',
  'pkg temp',
  'cpu package',
  'cpu temp',
  '^cpu$',
  'cpu',
  'coretemp',
  'k10temp',
  'zenpower',
  'cpu_thermal',
]
regex = true
case_sensitive = false
whole_word = false


# ==============================================================================
# 🌐 PART 5: MEMORY & NETWORK
# ==============================================================================

[memory_graph]
legend_position = "top-right"

# Display cache/buffer memory separately (Linux-specific)
cache_memory = false


[network_graph]
# Packet statistics omitted (bytes only)
show_packets = false


[network_graph.interface_filter]
# Exclude virtual network interfaces
is_list_ignored = true
list = [
  '^lo$',
  '^virbr\d+$',
  '^veth.*$',
  '^docker\d+$',
  '^br-[0-9a-f]+$',
  '^podman\d+$',
  '^vnet\d+$',
  '^cni.*$',
]
regex = true
case_sensitive = false
whole_word = false


# ==============================================================================
# 📐 PART 6: LAYOUT CONFIGURATION
# ==============================================================================
# Row 1: CPU (primary) + Temperature graph
# Row 2: Memory (primary) + Network
# Row 3: Process overview (primary)

[[row]]
ratio = 24
  [[row.child]]
  ratio = 4
  type = "cpu"

  [[row.child]]
  ratio = 1
  type = "temp_graph"


[[row]]
ratio = 32
  [[row.child]]
  ratio = 3
  type = "mem"

  [[row.child]]
  ratio = 1
  type = "net"


[[row]]
ratio = 44
  [[row.child]]
  type = "proc"
  default = true
