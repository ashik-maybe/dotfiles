# Alacritty — Catppuccin Macchiato theme. Shell inherits $SHELL (fish).

general.import = [
  "~/.config/alacritty/themes/catppuccin-macchiato.toml",
]


# Window: maximized at startup, full decorations, 1px padding, opaque.
[window]
startup_mode = "Maximized"
decorations = "Full"
padding = { x = 1, y = 1 }
opacity = 1


# Font: JetBrainsMono Nerd Font Mono, 12pt. Regular, Bold, Italic, Bold Italic.
[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
size = 12


# Cursor: beam, blinking, thin.
[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.15


# Scrollback: 20000 lines, 3 lines per wheel step.
[scrolling]
history = 20000
multiplier = 3


# Selection: copy to clipboard on select. Semantic chars group words for double-click.
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"


# Mouse: hide the pointer while typing.
[mouse]
hide_when_typing = true


# Bell: no sound, no animation.
[bell]
animation = "Linear"
duration = 0


# Keyboard: clipboard, font scaling, fullscreen. Same as kitty and foot.
[keyboard]
bindings = [
  # Clipboard
  { key = "C",       mods = "Control|Shift", action = "Copy" },
  { key = "V",       mods = "Control|Shift", action = "Paste" },

  # Font Scaling
  { key = "Plus",    mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control|Shift", action = "ResetFontSize" },

  # Fullscreen
  { key = "F11",     mods = "None",          action = "ToggleFullscreen" },
]


# Terminal: shell defaults to $SHELL. OSC52: copy only, no paste from escape sequences.
[terminal]
osc52 = "OnlyCopy"
