# Colors section of "Alacritty - TOML configuration file format"
# https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd#colors
# Eye Care Night (tuned from Gruvbox Material Medium Dark)

[colors.primary]
foreground = "#d5dae2"
background = "#1d2021"
dim_foreground = "#b8b4a8"
bright_foreground = "#d5dae2"

[colors.cursor]
text = "#1d2021"
cursor = "#a89984"

[colors.vi_mode_cursor]
text = "#1d2021"
