# ==============================================================================
# Helix Language Server & Formatter Overrides
# ==============================================================================

[[language]]
name = "typescript"
auto-format = true
formatter = { command = "prettierd", args = ["file.ts"] }

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettierd", args = ["file.js"] }

[[language]]
name = "json"
auto-format = true
formatter = { command = "prettierd", args = ["file.json"] }

[[language]]
name = "html"
auto-format = true
formatter = { command = "prettierd", args = ["file.html"] }

[[language]]
name = "css"
auto-format = true
formatter = { command = "prettierd", args = ["file.css"] }

[[language]]
name = "markdown"
auto-format = true
formatter = { command = "prettierd", args = ["file.md"] }

[[language]]
name = "python"
auto-format = true
formatter = { command = "uvx", args = ["ruff", "format", "-"] }

[[language]]
name = "go"
auto-format = true
