inherits = "default"

"ui.background" = { bg = "bg" }
"ui.text" = "fg"
"ui.text.focus" = "fg"
"ui.cursor" = { fg = "bg", bg = "accent" }
"ui.cursor.normal" = { fg = "bg", bg = "accent" }
"ui.cursor.insert" = { fg = "bg", bg = "green" }
"ui.cursor.select" = { fg = "bg", bg = "purple" }
"ui.linenr" = "muted"
"ui.linenr.selected" = "accent"
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.statusline" = { fg = "fg", bg = "surface" }
"ui.statusline.inactive" = { fg = "muted", bg = "surface" }
"ui.statusline.normal" = { fg = "bg", bg = "accent" }
"ui.statusline.insert" = { fg = "bg", bg = "green" }
"ui.statusline.select" = { fg = "bg", bg = "purple" }
"ui.popup" = { fg = "fg", bg = "surface" }
"ui.menu" = { fg = "fg", bg = "surface" }
"ui.menu.selected" = { fg = "bg", bg = "accent" }
"ui.window" = "border"
"ui.virtual.ruler" = { fg = "border" }
"ui.virtual.whitespace" = "muted"
"ui.virtual.indent-guide" = "border"
"ui.cursorline.primary" = { bg = "cursorline" }

"diagnostic.error" = { fg = "red" }
"diagnostic.warning" = { fg = "yellow" }
"diagnostic.info" = { fg = "blue" }
"diagnostic.hint" = { fg = "cyan" }
"error" = "red"
"warning" = "yellow"
"info" = "blue"
"hint" = "cyan"

"keyword" = "purple"
"function" = "blue"
"function.builtin" = "cyan"
"type" = "yellow"
"constant" = "orange"
"string" = "green"
"comment" = "muted"
"variable" = "fg"
"operator" = "cyan"
"punctuation" = "muted"
"tag" = "blue"
"attribute" = "cyan"
"namespace" = "purple"
"special" = "orange"

"markup.heading" = "accent"
"markup.link.url" = "blue"
"markup.link.text" = "cyan"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.raw" = "green"

"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

[palette]
bg = "#1d2021"
fg = "#d5dae2"
muted = "#b8b4a8"
border = "#7c6f64"
surface = "#262626"
selection = "#665c54"
cursorline = "#282828"
accent = "#7daea3"
red = "#ea6962"
orange = "#e09853"
yellow = "#e09853"
green = "#a9b665"
cyan = "#89b482"
blue = "#7daea3"
purple = "#d3869b"
