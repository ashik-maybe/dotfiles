# Foot — Eye Care Night (dark) theme. Toggle with Ctrl+Shift+T.

[main]
term=foot
initial-window-mode=maximized
workers=4

# Performance: no DPI awareness, no gamma blending. Tuned for low-end CPUs.
dpi-aware=no
gamma-correct-blending=no

# Window: resize by cells, keep the grid, 120ms resize delay.
resize-by-cells=yes
resize-keep-grid=yes
resize-delay-ms=120
box-drawings-uses-font-glyphs=no

# Padding: 1px to match alacritty and kitty.
pad=1x1

# Theme: dark. Both Eye Care themes are loaded so the toggle key can switch.
initial-color-theme=dark
include=~/.config/foot/themes/eye-care-day.ini
include=~/.config/foot/themes/eye-care-night.ini


# Font: JetBrainsMono Nerd Font Mono, 12pt.
font=JetBrainsMono Nerd Font Mono:style=Medium:size=12
font-bold=JetBrainsMono Nerd Font Mono:style=Bold:size=12
font-italic=JetBrainsMono Nerd Font Mono:style=Italic:size=12
font-bold-italic=JetBrainsMono Nerd Font Mono:style=Bold Italic:size=12

font-size-adjustment=0.5
letter-spacing=0


# Cursor: beam, blinking.
[cursor]
style=beam
blink=yes
beam-thickness=3


# Scrollback: 20000 lines, 3 lines per wheel step.
[scrollback]
lines=20000
multiplier=3.0
indicator-position=relative


# Keyboard: clipboard, font scaling, fullscreen, theme toggle. Same as alacritty and kitty.
[key-bindings]

clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert

spawn-terminal=Control+Shift+n
search-start=Control+Shift+r

font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Control+Home
scrollback-end=Control+End

show-urls-launch=Control+Shift+o
show-urls-persistent=Control+Shift+p

color-theme-toggle=Control+Shift+t


# Mouse: middle-click pastes, left selects, Ctrl+scroll scales the font.
[mouse]
hide-when-typing=yes

[mouse-bindings]

primary-paste=BTN_MIDDLE

select-begin=BTN_LEFT
select-extend=BTN_RIGHT
select-word=BTN_LEFT-2
select-quote=BTN_LEFT-3
select-row=BTN_LEFT-4

font-increase=Control+BTN_WHEEL_BACK
font-decrease=Control+BTN_WHEEL_FORWARD

scrollback-up-mouse=BTN_WHEEL_BACK
scrollback-down-mouse=BTN_WHEEL_FORWARD
