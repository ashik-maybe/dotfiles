# Lazygit — Catppuccin Latte theme (themes/catppuccin-latte.yml), Helix as editor.

gui:
  # 3-line scroll margin keeps context around the selection.
  scrollOffMargin: 3

  # Show arrows and counts for branches diverged from their base.
  showDivergenceFromBaseBranch: arrowAndNumber

  # Nerd Fonts v3 icons available, file icons off.
  nerdFontsVersion: "3"
  showFileIcons: false

  # Short author names in compact views, longer in full views.
  commitAuthorShortLength: 2
  commitAuthorLongLength: 17

  # Warn when a commit message exceeds the standard length.
  commitLength:
    show: true

  # Theme: Catppuccin Latte (mauve). Macchiato variant in themes/catppuccin-macchiato.yml.
  theme:
    activeBorderColor:
      - "#8839ef"
      - bold

    inactiveBorderColor:
      - "#6c6f85"

    searchingActiveBorderColor:
      - "#df8e1d"
      - bold

    optionsTextColor:
      - "#1e66f5"

    selectedLineBgColor:
      - "#ccd0da"

    inactiveViewSelectedLineBgColor:
      - "#9ca0b0"
      - bold

    cherryPickedCommitFgColor:
      - "#8839ef"

    cherryPickedCommitBgColor:
      - "#bcc0cc"

    markedBaseCommitFgColor:
      - "#1e66f5"

    markedBaseCommitBgColor:
      - "#df8e1d"

    unstagedChangesColor:
      - "#d20f39"

    defaultFgColor:
      - "#4c4f69"

    authorColors:
      "*": "#7287fd"
git:
  # Branches that git workflows treat as primary.
  mainBranches:
    - main
    - master
    - develop

  # Stage a file when its merge conflicts are resolved.
  autoStageResolvedConflicts: true

  # Commit history: topological order, graph always shown.
  log:
    order: topo-order
    showGraph: always

  # Copied commit hashes are truncated to 8 characters.
  truncateCopiedCommitHashesTo: 8

os:
  # Open files in the context-aware editor wrapper.
  edit: '~/.config/lazygit/edit.sh {{filename}}'
  editAtLine: '~/.config/lazygit/edit.sh {{filename}} {{line}}'

  # Syntax-highlighting pager. Uncomment after installing delta:
  # pagers:
  #   - pager: delta --dark --paging=never

# No startup tutorial popups.
disableStartupPopups: true
