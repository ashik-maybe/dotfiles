# Catppuccin Latte status colors
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left "#[fg=#eff1f5,bg=#8839ef,bold] #S #[fg=#8839ef,bg=#eff1f5] "
set -g status-right "#[fg=#6c6f85] %Y-%m-%d %H:%M #[fg=#8839ef] #[fg=#eff1f5,bg=#8839ef,bold] #H "
setw -g window-status-format "#[fg=#6c6f85,bg=#eff1f5] #I:#W "
setw -g window-status-current-format "#[fg=#eff1f5,bg=#8839ef,bold] #I:#W #[fg=#8839ef,bg=#eff1f5]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#8839ef"
set -g message-style "bg=#ccd0da,fg=#4c4f69"
set -g message-command-style "bg=#ccd0da,fg=#4c4f69"
