# Eye Care Night status colors
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1d2021,fg=#d5dae2"
set -g status-left "#[fg=#1d2021,bg=#7daea3,bold] #S #[fg=#7daea3,bg=#1d2021] "
set -g status-right "#[fg=#b8b4a8] %Y-%m-%d %H:%M #[fg=#7daea3] #[fg=#1d2021,bg=#7daea3,bold] #H "
setw -g window-status-format "#[fg=#b8b4a8,bg=#1d2021] #I:#W "
setw -g window-status-current-format "#[fg=#1d2021,bg=#7daea3,bold] #I:#W #[fg=#7daea3,bg=#1d2021]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#8f8574"
set -g pane-active-border-style "fg=#7daea3"
set -g message-style "bg=#32302f,fg=#d5dae2"
set -g message-command-style "bg=#32302f,fg=#d5dae2"
