# Eye Care Day status colors
set -g status-style "bg=#e6ead2,fg=#4c4f69"
set -g status-left "#[fg=#e6ead2,bg=#446e78,bold] #S #[fg=#446e78,bg=#e6ead2] "
set -g status-right "#[fg=#665c54] %Y-%m-%d %H:%M #[fg=#446e78] #[fg=#e6ead2,bg=#446e78,bold] #H "
setw -g window-status-format "#[fg=#665c54,bg=#e6ead2] #I:#W "
setw -g window-status-current-format "#[fg=#e6ead2,bg=#446e78,bold] #I:#W #[fg=#446e78,bg=#e6ead2]"
set -g pane-border-style "fg=#a89984"
set -g pane-active-border-style "fg=#446e78"
set -g message-style "bg=#f4e8be,fg=#4c4f69"
set -g message-command-style "bg=#f4e8be,fg=#4c4f69"
