# Tmux — Eye Care Night defaults. Prefix: Ctrl+A.

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# Behavior
set -g history-limit 20000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g repeat-time 300

# Splits and windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation and resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind n next-window
bind p previous-window

# Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Status bar: Eye Care Night
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1d2021,fg=#d5dae2"
set -g status-left "#[fg=#1d2021,bg=#7daea3,bold] #S #[fg=#7daea3,bg=#1d2021] "
set -g status-right "#[fg=#b8b4a8] %Y-%m-%d %H:%M #[fg=#7daea3] #[fg=#1d2021,bg=#7daea3,bold] #H "
setw -g window-status-format "#[fg=#b8b4a8,bg=#1d2021] #I:#W "
setw -g window-status-current-format "#[fg=#1d2021,bg=#7daea3,bold] #I:#W #[fg=#7daea3,bg=#1d2021]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#7c6f64"
set -g pane-active-border-style "fg=#7daea3"

# Messages
set -g message-style "bg=#32302f,fg=#d5dae2"
set -g message-command-style "bg=#32302f,fg=#d5dae2"

# Theme toggle
bind T source-file ~/.config/tmux/eye-care-light.conf \; display-message "Eye Care Light"
bind D source-file ~/.config/tmux/eye-care-dark.conf \; display-message "Eye Care Dark"
