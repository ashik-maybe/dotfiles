# Tmux — Catppuccin Latte defaults. Prefix: Ctrl+A.

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# Behavior
set -g history-limit 20000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g repeat-time 300

# Splits and windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation and resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind n next-window
bind p previous-window

# Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Floating Lazygit
bind g display-popup -d "#{pane_current_path}" -xC -yC -w80% -h80% -E lazygit

# Status bar theme — Latte is the default; toggle with T/D.
# Single source of truth: the theme files. Do not duplicate them here.
source-file ~/.config/tmux/catppuccin-latte.conf

# Theme toggle
bind T source-file ~/.config/tmux/catppuccin-latte.conf \; display-message "Catppuccin Latte"
bind D source-file ~/.config/tmux/catppuccin-macchiato.conf \; display-message "Catppuccin Macchiato"
