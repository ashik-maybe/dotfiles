# Catppuccin Macchiato status colors
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-left "#[fg=#24273a,bg=#c6a0f6,bold] #S #[fg=#c6a0f6,bg=#24273a] "
set -g status-right "#[fg=#a5adcb] %Y-%m-%d %H:%M #[fg=#c6a0f6] #[fg=#24273a,bg=#c6a0f6,bold] #H "
setw -g window-status-format "#[fg=#a5adcb,bg=#24273a] #I:#W "
setw -g window-status-current-format "#[fg=#24273a,bg=#c6a0f6,bold] #I:#W #[fg=#c6a0f6,bg=#24273a]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"
