# MPV keys — playback, seeking, speed, volume, subtitles, playlist, hard reset.

# Playback: pause, fullscreen, mute, quit. Q quits and saves position for later.
SPACE              cycle pause
k                  cycle pause
f                  cycle fullscreen
m                  cycle mute
q                  quit
Q                  quit-watch-later
MBTN_LEFT          cycle pause
MBTN_LEFT_DBL      cycle fullscreen

# Seeking: j/l jump 10s, arrows jump 5s, Shift+arrows jump 1s exact.
j                  seek -10
l                  seek 10
LEFT               seek -5
RIGHT              seek 5
Shift+LEFT         seek -1 exact
Shift+RIGHT        seek 1 exact
Shift+BACKSPACE    revert-seek
CONTROL+LEFT       add chapter -1
CONTROL+RIGHT      add chapter 1

# Frame stepping: , back one frame, . forward one frame.
,                  frame-back-step
.                  frame-step

# Speed: [ and ] change speed by 10%. Alt+1 to Alt+9 set fixed speeds.
[                  multiply speed 0.9
]                  multiply speed 1.1
Shift+<            multiply speed 0.9
Shift+>            multiply speed 1.1
Alt+1              set speed 1.0
Alt+2              set speed 1.25
Alt+3              set speed 1.5
Alt+4              set speed 1.75
Alt+5              set speed 2.0
Alt+6              set speed 2.25
Alt+7              set speed 2.5
Alt+8              set speed 2.75
Alt+9              set speed 3.0

# Percentage seeking: number keys jump to that percentage of the file.
0                  seek 0 absolute-percent
1                  seek 10 absolute-percent
2                  seek 20 absolute-percent
3                  seek 30 absolute-percent
4                  seek 40 absolute-percent
5                  seek 50 absolute-percent
6                  seek 60 absolute-percent
7                  seek 70 absolute-percent
8                  seek 80 absolute-percent
9                  seek 90 absolute-percent

# Volume: up and down arrows change volume by 5.
UP                 add volume 5
DOWN               add volume -5

# Audio and subtitles: cycle tracks, scale subtitle size.
c                  cycle sub
v                  cycle sub-visibility
a                  cycle audio
+                  add sub-scale 0.1
-                  add sub-scale -0.1

# Playlist and looping: Shift+p/n move in the playlist, L loops the file.
Shift+p            playlist-prev
Shift+n            playlist-next
ENTER              playlist-next
L                  cycle-values loop-file inf no
Ctrl+Shift+L       cycle-values loop-playlist inf no

# Chapters: PageUp and PageDown move between chapters.
PGUP               add chapter -1
PGDWN              add chapter 1

# Menus and utility: F8 playlist picker, F9 track picker, ? stats, Ctrl+v paste URL, Ctrl+r reload.
F8                 script-binding select/select-playlist
F9                 script-binding select/select-track
?                  script-binding stats/display-page-4
Ctrl+v             playlist-append ${clipboard}
Ctrl+r             reload

# Hard reset: clear zoom, pan, speed, rotation, color, aspect, and delays.
Ctrl+Shift+R       set window-scale 1.0; set video-zoom 0; set video-pan-x 0; set video-pan-y 0; set speed 1.0; set video-rotate 0; set contrast 0; set brightness 0; set gamma 0; set saturation 0; set video-aspect-override no; set sub-scale 1.0; set audio-delay 0; set sub-delay 0; set panscan 0; show-text "Reset to default"
