# MPV — GPU output, low-power scaling, 720p streaming cap, resume on quit.

# Video output and hardware decoding.
vo=gpu-next
hwdec=auto

# Scaling: bilinear everywhere. No interpolation, no debanding. Tuned for low power.
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
interpolation=no
deband=no
hdr-compute-peak=no
dither-depth=auto

# Frame sync: audio clock, drop frames in the video output when late.
video-sync=audio
framedrop=vo

# Cache: 64MiB forward, 32MiB back. Keep cache in memory, not on disk.
cache=yes
cache-on-disk=no
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=32MiB

# Playback: keep the window open at the end, resume position on next launch.
keep-open=yes
keep-open-pause=yes
save-position-on-quit=yes
resume-playback=yes
autoload-files=yes
audio-file-auto=fuzzy

# Streaming: cap yt-dlp downloads at 720p. Use the mpv720/mpv1080 abbreviations to override.
ytdl-format=bestvideo[height<=720]+bestaudio/best[height<=720]

# Window: on-screen controller on, auto-fit sizes, do not save window position.
osc=yes
cursor-autohide=500
autofit=70%
autofit-larger=90%x90%
autofit-smaller=50%
save-window-position=no
maximized=no

# Audio: start at 50% volume, allow up to 150%. English tracks first.
volume=50
volume-max=150
alang=en,eng

# Subtitles: white text, English first, fuzzy auto-load.
sub-pgs-vobsub=prefer
slang=en,eng
sub-auto=fuzzy
sub-font="Roboto"
sub-font-size=40
sub-color=1/1/1
sub-shadow-color=0/0/0/0.75
sub-border-color=0/0/0/0.95

# Screenshots: JPEG quality 90 into ~/Pictures/mpv-screenshots.
screenshot-format=jpg
screenshot-jpeg-quality=90
screenshot-directory=~/Pictures/mpv-screenshots

# Utility: stop the screensaver during playback.
stop-screensaver=yes
